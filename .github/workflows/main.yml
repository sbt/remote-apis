name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 8
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Build
      shell: bash
      run: |
        sbt -v -Dfile.encoding=UTF8 test
